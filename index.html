<html lang="ru">
<head>

<title>Albion — завоз на рынки</title>
<style>

:root[data-theme="dark"]{--bg:#16150f;--card:#201e17;--tx:#efece3;--mut:#9b988b;--line:#38352a;--acc:#e48a52;--accbg:#3a2417;--ok:#6fcf97;--okbg:#17301f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accbg);color:var(--acc);border-radius:8px;padding:4px 9px;font-weight:600}
.chip b{font-size:16px}
.muted{color:var(--mut)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--mut)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:150px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.cell{display:inline-flex;align-items:center;gap:2px}
.cell button{width:26px;height:30px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:7px;font-size:16px;cursor:pointer;padding:0}
.cell input{width:44px;height:30px;text-align:center;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--tx);font:inherit;font-weight:600}
.cell input.has{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=number]{-moz-appearance:textfield}
.tot{font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.btn.del{color:#c0392b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.city{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.city header{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700;border-bottom:1px solid var(--line)}
.city ul{list-style:none;margin:0;padding:4px 12px}
.city li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.city li:last-child{border:0}
.city li .q{font-weight:800;font-size:18px;color:var(--acc);min-width:36px}
.city li .n{flex:1}
.city footer{padding:8px 12px;border-top:1px solid var(--line)}
.empty{padding:14px 12px;color:var(--mut)}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.form input,.form select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;padding:0 8px}
.form input[list]{min-width:220px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:12px monospace;padding:8px;margin-top:8px}
.hint{color:var(--mut);font-size:12px;min-width:26px;text-align:left}
.ic{display:inline-block;min-width:1.5em;text-align:center;margin-right:4px;vertical-align:middle}
.ico{width:30px;height:30px;vertical-align:middle}
</style>
</head>

function walkUpd(i,c){const s=sget(i,c),t=tget(i,c);const el=document.querySelector('input.sk[data-i="'+i+'"][data-c="'+c+'"]');if(el)el.classList.toggle('has',s!=null&&s<t);document.querySelectorAll('[data-rt]').forEach(x=>x.textContent=rowTot(x.dataset.rt));document.querySelectorAll('[data-ct]').forEach(x=>x.textContent=colTot(x.dataset.ct));const sm=document.getElementById('sum');if(sm)sm.outerHTML=summary()}

function vWalk(){
  if(!S.items.length)return '<div class="card muted">Добавь товары на вкладке «Товары».</div>';
  const head=CITIES.map(c=>`<th><span class="dot" style="background:${c.c}"></span>${c.n}<br><button class="btn" data-a="empty" data-c="${c.id}" style="margin-top:4px;font-size:11px;padding:2px 6px">пусто</button></th>`).join('');
  const rows=S.items.map(i=>`<tr><td>${lab(i)}</td>${CITIES.map(c=>{const t=tget(i.id,c.id),s=sget(i.id,c.id);return t?`<td><div class="cell"><input type="number" min="0" class="sk${s!=null&&s<t?' has':''}" value="${s==null?'':s}" placeholder="—" data-i="${i.id}" data-c="${c.id}" inputmode="numeric"><span class="hint">/${t}</span></div></td>`:'<td class="muted">—</td>'}).join('')}<td class="tot" data-rt="${i.id}">${rowTot(i.id)}</td></tr>`).join('');
  const foot=`<tr><td class="muted">Завезти в город</td>${CITIES.map(c=>`<td class="tot" data-ct="${c.id}">${colTot(c.id)}</td>`).join('')}<td></td></tr>`;
  return summary()+`<div class="card"><p class="muted" style="margin:0 0 10px">Вводи, сколько штук осталось на рынке в каждом городе (цель стоит справа от поля). Пустое поле — город ещё не обходил. Недостача считается сама и попадает в «Что завести» и «По городам».</p><div class="tools" style="margin-bottom:10px"><button class="btn" data-a="clrstock">Новая неделя: очистить остатки</button></div><div class="scroll"><table><thead><tr><th style="text-align:left">Товар</th>${head}<th>Завезти</th></tr></thead><tbody>${rows}${foot}</tbody></table></div></div>`;
}
function vTargets(){
  if(!S.items.length)return '<div class="card muted">Добавь товары на вкладке «Товары».</div>';
  const head=CITIES.map(c=>`<th><span class="dot" style="background:${c.c}"></span>${c.n}</th>`).join('');
  const rows=S.items.map(i=>`<tr><td>${lab(i)}</td>${CITIES.map(c=>`<td><div class="cell"><input type="number" min="0" class="tg" value="${tget(i.id,c.id)}" data-i="${i.id}" data-c="${c.id}" inputmode="numeric"></div></td>`).join('')}<td><input type="number" min="0" class="rowt" placeholder="всем" data-i="${i.id}" style="${sm0}"></td></tr>`).join('');
  return `<div class="card"><div class="tools" style="margin-bottom:10px"><label class="muted">Цель по умолчанию: <input type="number" min="0" id="deft" value="${dT()}" style="${sm0}"></label><span class="muted">шт. на рынок. 0 — в этот город товар не возить.</span></div><div class="scroll"><table><thead><tr><th style="text-align:left">Товар</th>${head}<th>Всем</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
const whOf=i=>{const w=S.wh&&S.wh[i.id];return CITIES.some(c=>c.id===w)?w:null};
const cn=id=>(CITIES.find(c=>c.id===id)||{}).n;
function groups(list){const m=[];CITIES.forEach(c=>{const g=list.filter(i=>whOf(i)===c.id);if(g.length)m.push([c.id,g])});const r=list.filter(i=>!whOf(i));if(r.length)m.push([null,r]);return m}
function summary(){
  const ml=S.items.filter(i=>rowTot(i.id)>0),hw=S.items.some(whOf);const ch=groups(ml).map(([w,g])=>(hw?`<div class="muted" style="margin:8px 0 4px;font-size:13px">${w?'Склад: '+cn(w):'Склад не указан'}</div>`:'')+`<div class="chips">${g.map(i=>`<span class="chip">${lab(i)} × <b>${rowTot(i.id)}</b></span>`).join('')}</div>`).join('');
  return `<div class="card" id="sum"><h2>Всего взять со склада</h2>${ch||'<span class="muted">Пока ничего не выбрано</span>'}</div>`;
}
function vPlan(){
  if(!S.items.length)return '<div class="card muted">Добавь товары на вкладке «Товары».</div>';
  const head=CITIES.map(c=>`<th><span class="dot" style="background:${c.c}"></span>${c.n}</th>`).join('');
  const rows=S.items.map(i=>`<tr><td>${lab(i)}</td>${CITIES.map(c=>{const v=get(i.id,c.id);return `<td><div class="cell"><button data-a="dec" data-i="${i.id}" data-c="${c.id}">−</button><input type="number" min="0" class="q${v?' has':''}" value="${v}" data-i="${i.id}" data-c="${c.id}" inputmode="numeric"><button data-a="inc" data-i="${i.id}" data-c="${c.id}">+</button></div></td>`}).join('')}<td class="tot">${rowTot(i.id)}</td><td><button class="btn" data-a="all" data-i="${i.id}" title="Добавить шаг во все города">+ всем</button></td></tr>`).join('');
  const foot=`<tr><td class="muted">Итого в город</td>${CITIES.map(c=>`<td class="tot">${colTot(c.id)}</td>`).join('')}<td class="tot">${S.items.reduce((a,i)=>a+rowTot(i.id),0)}</td><td></td></tr>`;
  return summary()+`<div class="card"><div class="tools" style="margin-bottom:10px"><label class="muted">Шаг кнопок +/−: <input type="number" min="1" value="${S.batch}" id="batch" style="width:56px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--tx);text-align:center;font:inherit"></label><button class="btn" data-a="reset">Сбросить все количества</button></div><div class="scroll"><table><thead><tr><th style="text-align:left">Товар</th>${head}<th>Всего</th><th></th></tr></thead><tbody>${rows}${foot}</tbody></table></div></div>`;
}
function vCities(){
  const cards=CITIES.map(c=>{
    const li=groups(S.items).flatMap(g=>g[1]).filter(i=>get(i.id,c.id)>0).map(i=>`<li><span class="n">${lab(i)}${whOf(i)?`<br><span class="hint">${whOf(i)===c.id?'склад в этом городе':'взять: '+cn(whOf(i))}</span>`:''}</span><span class="q">×${get(i.id,c.id)}</span><button class="btn ok" data-a="done" data-i="${i.id}" data-c="${c.id}">✓ завёз</button></li>`).join('');
    return `<div class="city"><header><span><span class="dot" style="background:${c.c}"></span>${c.n}</span><span class="muted">${colTot(c.id)} шт.</span></header>${li?`<ul>${li}</ul><footer><button class="btn" data-a="doneall" data-c="${c.id}">Весь город завезён</button></footer>`:'<div class="empty">Ничего везти не нужно</div>'}</div>`}).join('');
  return summary()+`<div class="grid">${cards}</div>`;
}
function vItems(){
  const list=S.items.map(i=>`<div class="row"><span>${lab(i)}</span><select class="wh" data-i="${i.id}" style="margin-left:auto;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;padding:0 6px"><option value="">Склад: не указан</option>${CITIES.map(c=>`<option value="${c.id}"${whOf(i)===c.id?' selected':''}>${c.n}</option>`).join('')}</select><button class="btn del" data-a="rm" data-i="${i.id}">${armed===i.id?'Точно удалить?':'Удалить'}</button></div>`).join('')||'<span class="muted">Список пуст</span>';
  const opts=CAT.map(c=>`<option value="${esc(c[1])}" label="${esc(c[2])}">`).join('');
  const t=[4,5,6,7,8].map(x=>`<option${x===5?' selected':''}>${x}</option>`).join('');
  const e=[0,1,2,3,4].map(x=>`<option${x===3?' selected':''}>${x}</option>`).join('');
  return `<div class="card"><h2>Добавить товар</h2><div class="form"><label>Название<input id="nn" list="pl" placeholder="Начни вводить и выбери из списка" autocomplete="off"></label><datalist id="pl">${opts}</datalist><label>Тир<select id="nt">${t}</select></label><label>Зачарование<select id="ne">${e}</select></label><button class="btn pri" data-a="add" style="height:36px">Добавить</button></div></div>
<div class="card"><h2>Мои товары</h2>${list}</div>
<div class="card"><h2>Резервная копия</h2><div class="tools"><button class="btn" data-a="export">Экспорт</button><button class="btn" data-a="import">Импорт</button></div>${ioText!==null?`<textarea id="io" placeholder="Вставь сюда сохранённые данные и нажми «Применить»">${esc(ioText)}</textarea><button class="btn pri" data-a="apply" style="margin-top:8px">Применить</button>`:''}</div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=b.dataset.i,c=b.dataset.c,st=S.batch||5;
  if(a==='tab'){tab=b.dataset.k;armed=null}
  else if(a==='inc')set(i,c,get(i,c)+st);
  else if(a==='dec')set(i,c,get(i,c)-st);
  else if(a==='all')CITIES.forEach(x=>set(i,x.id,get(i,x.id)+st));
  else if(a==='done'){set(i,c,0);if(S.sk&&S.sk[i])delete S.sk[i][c]}
  else if(a==='doneall')S.items.forEach(x=>{set(x.id,c,0);if(S.sk&&S.sk[x.id])delete S.sk[x.id][c]});
  else if(a==='reset'){if(armed==='reset'){S.need={};S.sk={};armed=null}else{armed='reset';b.textContent='Точно сбросить?';return}}
  else if(a==='rm'){if(armed===i){S.items=S.items.filter(x=>x.id!==i);delete S.need[i];armed=null}else armed=i}
  else if(a==='add'){const n=document.getElementById('nn').value.trim();if(!n)return;const h=findCat(n);S.seq=(S.seq||0)+1;S.items.push({id:'i'+S.seq+'_'+Date.now().toString(36),name:h?h[1]:n,key:h?h[0]:null,tier:+document.getElementById('nt').value,ench:+document.getElementById('ne').value})}
  else if(a==='empty')S.items.forEach(x=>{if(tget(x.id,c)>0)sset(x.id,c,0)});
  else if(a==='clrstock')S.sk={};
  else if(a==='export')ioText=JSON.stringify(S);
  else if(a==='import')ioText='';
  else if(a==='apply'){try{const o=JSON.parse(document.getElementById('io').value);if(o&&Array.isArray(o.items)&&o.need){S=o;ioText=null}}catch(x){return}}
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='batch'){S.batch=Math.max(1,Math.floor(+t.value)||5);save();render();return}
  if(t.classList.contains('q')){set(t.dataset.i,t.dataset.c,t.value);save();render();return}
  if(t.classList.contains('wh')){S.wh=S.wh||{};S.wh[t.dataset.i]=t.value;save();return}
  if(t.classList.contains('sk')){sset(t.dataset.i,t.dataset.c,t.value);save();walkUpd(t.dataset.i,t.dataset.c);return}
  if(t.classList.contains('tg')){tset(t.dataset.i,t.dataset.c,t.value);save();return}
  if(t.classList.contains('rowt')){if(t.value!==''){CITIES.forEach(c=>tset(t.dataset.i,c.id,t.value));save();render()}return}
  if(t.id==='deft'){S.defT=Math.max(0,Math.floor(+t.value)||0);save();render()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('sk')){sset(t.dataset.i,t.dataset.c,t.value);save();walkUpd(t.dataset.i,t.dataset.c)}});
render();
</script>
</body>
</html>
