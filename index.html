body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brandtx);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accbg);color:var(--acc);border-radius:8px;padding:4px 9px;font-weight:600}
.chip b{font-size:16px}
.muted{color:var(--mut)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--mut)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:150px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.cell{display:inline-flex;align-items:center;gap:2px}
.cell button{width:26px;height:30px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:7px;font-size:16px;cursor:pointer;padding:0}
.cell input{width:44px;height:30px;text-align:center;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--tx);font:inherit;font-weight:600}
.cell input.has{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=number]{-moz-appearance:textfield}
.tot{font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brandtx);font-weight:600}
.btn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.btn.del{color:#c0392b}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.cell.v{flex-direction:column;gap:2px}
.cell.v .hint{min-width:0;text-align:center;line-height:1}
.city{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.city header{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700;border-bottom:1px solid var(--line)}
.city ul{list-style:none;margin:0;padding:4px 12px}
.city li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.city li:last-child{border:0}
.city li .q{font-weight:800;font-size:18px;color:var(--acc);min-width:36px}
.city li .n{flex:1}
.city footer{padding:8px 12px;border-top:1px solid var(--line)}
.empty{padding:14px 12px;color:var(--mut)}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.form input,.form select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;padding:0 8px}
.form input[list]{min-width:220px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:12px monospace;padding:8px;margin-top:8px}
.hint{color:var(--mut);font-size:12px;min-width:26px;text-align:left}
.ic{display:inline-block;min-width:46px;text-align:center;margin-right:4px;vertical-align:middle}
.ico{width:46px;height:46px;vertical-align:middle}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#login.on{display:flex}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:340px}
.lbox input{width:100%;height:40px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;padding:0 10px}
.hdr{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#14203f,#26396b);border-radius:16px;padding:12px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,32,63,.25);border-bottom:3px solid #e0b83e}
.hdr img{width:64px;height:64px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));flex:none}
.hdr h1{margin:0;font-size:22px;line-height:1.15;color:#f4d472;letter-spacing:.01em}
.hdr .sub{margin:6px 0 0;color:#c4cce2}
.hdr .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#f4d472}
@media (max-width:480px){.hdr{padding:10px 12px;gap:10px}.hdr img{width:48px;height:48px}.hdr h1{font-size:18px}}
.lbox .lg{display:block;margin:0 auto 6px;width:84px;height:84px}
</style>
</head>
